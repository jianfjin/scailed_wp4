openapi: 3.1.0
info:
  title: SCAILED Pathfinder — Public Interface (WP Boundary Contracts + Service API)
  version: 0.1.0
  description: 'Machine-readable view of the WP boundary data interface and the Pathfinder service API.


    * Normative companion (human-readable): `docs/16_wp_boundary_data_protocol.md` ([Confluence page](https://edmf.atlassian.net/wiki/spaces/S/pages/11370498)).

    * Source of truth for payload structures: `contracts/*.schema.json` — the `SnapshotEnvelope` components below
    are embedded verbatim from those files.

    * Every imported snapshot passes the four validation gates at activation time (`scripts/validate_contracts.py`,
    also executed in-process by the server).


    Boundary flow: WP2/WP3/WP8 (and WP4 self-descriptions) deliver versioned JSON snapshots via `POST /v1/admin/import`;
    `GET /health` reports the active snapshot generation. Paths under `/admin/import/*` are the legacy per-WP demo
    endpoints retained for the in-memory mode.'
