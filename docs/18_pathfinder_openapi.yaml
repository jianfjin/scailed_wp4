    PF_pf_taxonomy_v1:
      title: pf.taxonomy.v1 payload — WP2 stakeholder taxonomy (B1)
      description: Machine-readable projection of T2.1 stakeholder mapping / D2.1. WP2 owns content; format is frozen
        here.
      type: object
      required:
      - dimensions
      - stakeholder_types
      - scenarios
      - capability_vocabulary
      additionalProperties: false
      properties:
        capability_vocabulary:
          type: array
          uniqueItems: true
          items:
            type: string
            pattern: ^[a-z0-9-]+$
        dimensions:
          type: array
          minItems: 1
          description: Shared maturity vocabulary. positioning_axis reflects MS4.1 (technical/operational/regulatory
            positioning).
          items:
            type: object
            required:
            - dimension_id
            - label
            - positioning_axis
            - state_key
            additionalProperties: false
            properties:
              dimension_id:
                $ref: '#/components/schemas/PF_pf_taxonomy_v1/$defs/id'
              state_key:
                type: string
                enum:
                - governance
                - data
                - compliance
                - infrastructure
                - capability
              label:
                type: string
                minLength: 1
              positioning_axis:
                type: string
                enum:
                - technical
                - operational
                - regulatory
              scale:
                type: object
                properties:
                  min:
                    const: 1
                  max:
                    const: 5
                additionalProperties: false
        stakeholder_types:
          type: array
          minItems: 5
          items:
            type: object
            required:
            - stakeholder_type_id
            - label
            - ehds_roles
            - status
            additionalProperties: false
            properties:
              stakeholder_type_id:
                $ref: '#/components/schemas/PF_pf_taxonomy_v1/$defs/id'
              label:
                type: string
                minLength: 1
              description:
                type: string
              ehds_roles:
                type: array
                minItems: 1
                items:
                  type: string
                  enum:
                  - data-holder
                  - data-user
                  - intermediary
                  - regulator
                  - developer
                description: T2.1 role classification (health data holders/users).
              segment:
                type: string
                description: 'T2.1 segment: industry, regulators, researchers, patient organisations, healthcare
                  authorities, ...'
              capabilities:
                type: array
                items:
                  type: string
              personas:
                type: array
                items:
                  type: object
                  required:
                  - persona_id
                  - label
                  properties:
                    persona_id:
                      $ref: '#/components/schemas/PF_pf_taxonomy_v1/$defs/id'
                    label:
                      type: string
                    influence:
                      type: string
                      enum:
                      - low
                      - medium
                      - high
                    interest:
                      type: string
                      enum:
                      - low
                      - medium
                      - high
                  additionalProperties: false
              status:
                type: string
                enum:
                - active
                - deprecated
              successor:
                oneOf:
                - type: 'null'
                - $ref: '#/components/schemas/PF_pf_taxonomy_v1/$defs/id'
        scenarios:
          type: array
          minItems: 1
          items:
            type: object
            required:
            - scenario_id
            - label
            - applicable_stakeholder_types
            additionalProperties: false
            properties:
              scenario_id:
                $ref: '#/components/schemas/PF_pf_taxonomy_v1/$defs/id'
              label:
                type: string
                minLength: 1
              target_description:
                type: string
              applicable_stakeholder_types:
                type: array
                minItems: 1
                items:
                  type: string
        metadata:
          type: object
          additionalProperties: true
      $defs:
        id:
          type: string
          pattern: ^pf:wp2:[a-z-]+:[a-z0-9-]{1,64}$
    PF_pf_questionnaire_v1:
      title: pf.questionnaire.v1 payload — WP4 questionnaires published for WP2 review (B2)
      description: T2.4 has WP2 support WP4 pathfinding content; this contract is the review channel. Field names
        match pathfinder/core/models.py Question/Questionnaire so the snapshot imports without transformation.
      type: object
      required:
      - stakeholder_type
      - version
      - title
      - target_scenarios
      - questions
      additionalProperties: false
      properties:
        stakeholder_type:
          $ref: '#/components/schemas/PF_pf_questionnaire_v1/$defs/taxid'
          description: References an active pf.taxonomy.v1 stakeholder_type_id.
        version:
          type: string
          minLength: 1
        title:
          type: string
          minLength: 1
        target_scenarios:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/PF_pf_questionnaire_v1/$defs/taxid'
          description: Scenario IDs from the active taxonomy.
        questions:
          type: array
          minItems: 1
          items:
            type: object
            required:
            - question_id
            - label
            - question_type
            - required
            additionalProperties: false
            properties:
              question_id:
                $ref: '#/components/schemas/PF_pf_questionnaire_v1/$defs/qid'
              label:
                type: string
                minLength: 1
              help_text:
                type: string
              question_type:
                type: string
                enum:
                - single_choice
                - multi_choice
                - numeric
                - text
              required:
                type: boolean
              options:
                type: array
                items:
                  type: string
              min_value:
                type:
                - integer
                - 'null'
              max_value:
                type:
                - integer
                - 'null'
                description: 'numeric questions: scale 1..5 enforced referentially (integer maturity, RFQ 3.2).'
              maturity_dimension:
                oneOf:
                - type: 'null'
                - $ref: '#/components/schemas/PF_pf_questionnaire_v1/$defs/taxid'
                description: Taxonomy dimension_id when the question feeds a maturity dimension.
              state_field:
                type: string
                enum:
                - capabilities
                - missing_capabilities
                - regulatory_flags
                description: A multi-choice answer directly supplies this state collection.
              visible_if:
                type:
                - object
                - 'null'
                description: 'Conditional visibility: same condition grammar as pf.rulebundle.v1 conditions.'
                additionalProperties: true
              capability_maps_to:
                type: array
                items:
                  type: string
        review_status:
          type: string
          enum:
          - draft
          - for-review
          - approved
          default: for-review
        metadata:
          type: object
          additionalProperties: true
      $defs:
        qid:
          type: string
          pattern: ^pf:wp4:question:[a-z0-9-]{1,64}$
        taxid:
          type: string
          pattern: ^pf:wp(2|4):[a-z-]+:[a-z0-9-]{1,64}$
    PF_pf_roadmap_v1:
      title: pf.roadmap.v1 payload — WP3 strategic roadmap + landscape catalog (B3)
      description: 'Machine-readable projection of T3.3/D3.2 roadmap actions and the D3.1 priority-dataset catalog.
        Node categories follow the T3.3 wording: priority applications, essential data foundations, deployment pathways,
        semantic interoperability, governance, emerging infrastructures; time horizons are the short/medium/long-term
        actions of T3.3.'
      type: object
      required:
      - nodes
      - edges
      additionalProperties: false
      properties:
        nodes:
          type: array
          minItems: 1
          items:
            type: object
            required:
            - node_id
            - label
            - dimension
            - maturity_level
            - stakeholder_types
            - prerequisites
            - source_wp
            - source_doc_ref
            - confidence
            additionalProperties: false
            properties:
              node_id:
                $ref: '#/components/schemas/PF_pf_roadmap_v1/$defs/id'
              label:
                type: string
                minLength: 1
              description:
                type: string
              dimension:
                type: string
                enum:
                - governance
                - data
                - compliance
                - infrastructure
                - capability
              action_type:
                type: string
                enum:
                - priority_application
                - data_foundation
                - deployment_pathway
                - semantic_interoperability
                - governance_action
                - infrastructure_provision
              time_horizon:
                type: string
                enum:
                - short
                - medium
                - long
              maturity_level:
                type: integer
                minimum: 1
                maximum: 5
              stakeholder_types:
                type: array
                minItems: 1
                items:
                  type: string
                description: 'Taxonomy stakeholder_type IDs or ''all''. T3.3: clear responsibilities and actions
                  for all stakeholders.'
              responsibility_notes:
                type: array
                items:
                  type: string
              prerequisites:
                type: array
                items:
                  $ref: '#/components/schemas/PF_pf_roadmap_v1/$defs/id'
              dataset_refs:
                type: array
                items:
                  $ref: '#/components/schemas/PF_pf_roadmap_v1/$defs/dsid'
                description: Optional links to the D3.1 priority dataset catalog below.
              status:
                type: string
                enum:
                - active
                - deprecated
              successor:
                oneOf:
                - type: 'null'
                - $ref: '#/components/schemas/PF_pf_roadmap_v1/$defs/id'
              source_wp:
                type: string
                const: WP3
              source_doc_ref:
                type: string
                minLength: 1
              confidence:
                type: number
                minimum: 0
                maximum: 1
              metadata:
                type: object
                additionalProperties: true
        edges:
          type: array
          items:
            type: object
            required:
            - edge_id
            - from_node_id
            - to_node_id
            - relation_type
            additionalProperties: false
            properties:
              edge_id:
                $ref: '#/components/schemas/PF_pf_roadmap_v1/$defs/eid'
              from_node_id:
                $ref: '#/components/schemas/PF_pf_roadmap_v1/$defs/id'
              to_node_id:
                $ref: '#/components/schemas/PF_pf_roadmap_v1/$defs/id'
              relation_type:
                type: string
                enum:
                - prerequisite
                - enabler
                - alternative
              required:
                type: boolean
                default: true
              source_doc_ref:
                type: string
        datasets:
          type: array
          description: D3.1 catalogue of high-priority datasets; characteristics per T3.1.1.
          items:
            type: object
            required:
            - dataset_id
            - label
            additionalProperties: false
            properties:
              dataset_id:
                $ref: '#/components/schemas/PF_pf_roadmap_v1/$defs/dsid'
              label:
                type: string
                minLength: 1
              availability:
                type: string
                enum:
                - available
                - planned
                - limited
                - unknown
              suitability:
                type: number
                minimum: 0
                maximum: 1
              quality:
                type: number
                minimum: 0
                maximum: 1
              representativeness:
                type: number
                minimum: 0
                maximum: 1
              completeness:
                type: number
                minimum: 0
                maximum: 1
              ai_act_alignment:
                type: string
                enum:
                - aligned
                - conditional
                - gap
                - unassessed
              maturity:
                type:
                - number
                - 'null'
                minimum: 0
                maximum: 1
                description: 'T3.1.1 seventh characterisation attribute: dataset maturity.'
              source_doc_ref:
                type: string
        metadata:
          type: object
          additionalProperties: true
      $defs:
        id:
          type: string
          pattern: ^pf:wp3:node:[a-z0-9-]{1,64}$
        eid:
          type: string
          pattern: ^pf:wp3:edge:[a-z0-9-]{1,64}$
        dsid:
          type: string
          pattern: ^pf:wp3:dataset:[a-z0-9-]{1,64}$
    PF_pf_rulebundle_v1:
      title: pf.rulebundle.v1 payload — WP8 regulatory rules, references and tests (B4)
      description: 'Machine-readable projection of T8.2/T8.3 outputs (''road legal'' per T4.1). Legal instruments
        per T8.3.2: EHDSR and the interplay with AI Act, IVDR/MDR, HTA Regulation, GDPR, and key forthcoming pieces
        (e.g. Biotech Act). Provisional status mirrors the phased T8.3 sub-task drafts: unverified regulatory state,
        never a legal conclusion.'
      type: object
      required:
      - references
      - rules
      - tests
      additionalProperties: false
      properties:
        references:
          type: array
          minItems: 1
          items:
            type: object
            required:
            - ref_id
            - instrument
            - status
            additionalProperties: false
            properties:
              ref_id:
                $ref: '#/components/schemas/PF_pf_rulebundle_v1/$defs/id'
              instrument:
                type: string
                enum:
                - EHDSR
                - GDPR
                - AI-Act
                - IVDR
                - MDR
                - HTAR
                - Data-Act
                - Biotech-Act
                - national
                - other
              locator:
                type: string
                description: Article/annex/recital or section, e.g. 'Art.9(2)' or 'Annex I'.
              eur_lex_uri:
                type: string
                format: uri
              status:
                type: string
                enum:
                - in-force
                - provisional
                - forthcoming
              source_doc_ref:
                type: string
        rules:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/PF_pf_rulebundle_v1/$defs/rule'
        tests:
          type: array
          minItems: 1
          description: Paired rule tests, executed at import and in CI (docs/13 import protocol).
          items:
            type: object
            required:
            - test_id
            - rule_id
            - given
            - expect
            additionalProperties: false
            properties:
              test_id:
                type: string
              rule_id:
                $ref: '#/components/schemas/PF_pf_rulebundle_v1/$defs/rid'
              given:
                type: object
                description: 'StakeholderState field assertions, keyed by state path, e.g. ''capabilities: [legal-basis]'',
                  ''maturity.data: 2'', ''flags: [x]''.'
                additionalProperties: true
              expect:
                type: object
                required:
                - outcome
                properties:
                  outcome:
                    type: string
                    enum:
                    - triggered
                    - not-triggered
                    - blocked
                  action_contains:
                    type: string
                additionalProperties: false
        metadata:
          type: object
          additionalProperties: true
      $defs:
        id:
          type: string
          pattern: ^pf:wp8:reg:[a-z0-9-]{1,64}$
        rid:
          type: string
          pattern: ^pf:wp8:rule:[a-z0-9-]{1,64}$
        condition:
          type: object
          description: 'Recursive boolean tree or atomic predicate. Atomic: {field, op, value}. Field values are
            state paths over StakeholderState.'
          oneOf:
          - type: object
            required:
            - and
            properties:
              and:
                type: array
                minItems: 1
                items:
                  $ref: '#/components/schemas/PF_pf_rulebundle_v1/$defs/condition'
            additionalProperties: false
          - type: object
            required:
            - or
            properties:
              or:
                type: array
                minItems: 1
                items:
                  $ref: '#/components/schemas/PF_pf_rulebundle_v1/$defs/condition'
            additionalProperties: false
          - type: object
            required:
            - not
            properties:
              not:
                $ref: '#/components/schemas/PF_pf_rulebundle_v1/$defs/condition'
            additionalProperties: false
          - type: object
            required:
            - field
            - op
            properties:
              field:
                type: string
                minLength: 1
              op:
                type: string
                enum:
                - eq
                - ne
                - gt
                - gte
                - lt
                - lte
                - in
                - not_in
                - contains
                - exists
              value: {}
            additionalProperties: false
        rule:
          type: object
          required:
          - rule_id
          - rule_type
          - priority
          - applies_to
          - condition
          - action
          - compliance_refs
          - source_doc_ref
          - rule_version
          - status
          additionalProperties: false
          properties:
            rule_id:
              $ref: '#/components/schemas/PF_pf_rulebundle_v1/$defs/rid'
            parent_rule_id:
              type:
              - string
              - 'null'
            rule_type:
              type: string
              enum:
              - eligibility
              - exclusion
              - preference
              - override
            priority:
              type: integer
            applies_to:
              type: array
              minItems: 1
              items:
                type: string
            status:
              type: string
              enum:
              - verified
              - provisional
              description: provisional -> Pathfinder renders unverified regulatory state (RFQ 3.4).
            condition:
              $ref: '#/components/schemas/PF_pf_rulebundle_v1/$defs/condition'
            action:
              type: object
              required:
              - title
              - text
              additionalProperties: false
              properties:
                title:
                  type: string
                  minLength: 1
                text:
                  type: string
                  minLength: 1
                node_id:
                  type:
                  - string
                  - 'null'
                  description: Roadmap node ID this action advances.
                block:
                  type: boolean
                  default: false
                warning:
                  type: string
            compliance_refs:
              type: array
              items:
                $ref: '#/components/schemas/PF_pf_rulebundle_v1/$defs/id'
            source_doc_ref:
              type: string
            rule_version:
              type: string
              minLength: 1
            effective_from:
              type:
              - string
              - 'null'
              format: date
            effective_until:
              type:
              - string
              - 'null'
              format: date
    PF_pf_feedback_v1:
      type: object
      required:
      - period
      - min_cohort_size
      - recipient
      additionalProperties: false
      properties:
        period:
          type: object
          required:
          - from
          - to
          additionalProperties: false
          properties:
            from:
              type: string
              format: date
            to:
              type: string
              format: date
        min_cohort_size:
          type: integer
          minimum: 5
          default: 5
        roadmap:
          type: object
          required:
          - node_stats
          additionalProperties: false
          properties:
            node_stats:
              type: array
              items:
                type: object
                required:
                - node_id
                - visits
                - cohort_size
                additionalProperties: false
                properties:
                  node_id:
                    $ref: '#/components/schemas/PF_pf_feedback_v1/$defs/rmid'
                  visits:
                    type: integer
                    minimum: 0
                  as_current_position:
                    type: integer
                    minimum: 0
                  as_target:
                    type: integer
                    minimum: 0
                  blocked_by_prerequisite_count:
                    type: integer
                    minimum: 0
                  label_incompleteness_reports:
                    type: integer
                    minimum: 0
                  cohort_size:
                    type: integer
                    minimum: 5
            unsatisfiable_route_ids:
              type: array
              items:
                $ref: '#/components/schemas/PF_pf_feedback_v1/$defs/rmid'
          description: B5 to WP3
        rules:
          type: object
          required:
          - rule_stats
          additionalProperties: false
          properties:
            rule_stats:
              type: array
              items:
                type: object
                required:
                - rule_id
                - cohort_size
                additionalProperties: false
                properties:
                  rule_id:
                    $ref: '#/components/schemas/PF_pf_feedback_v1/$defs/ruleid'
                  evaluations:
                    type: integer
                    minimum: 0
                  triggers:
                    type: integer
                    minimum: 0
                  block_events:
                    type: integer
                    minimum: 0
                  unverified_marker_count:
                    type: integer
                    minimum: 0
                  conflict_events:
                    type: integer
                    minimum: 0
                  cohort_size:
                    type: integer
                    minimum: 5
            never_fired_rule_ids:
              type: array
              items:
                $ref: '#/components/schemas/PF_pf_feedback_v1/$defs/ruleid'
          description: B6 to WP8
        questionnaire:
          type: object
          required:
          - question_stats
          additionalProperties: false
          properties:
            question_stats:
              type: array
              items:
                type: object
                required:
                - question_id
                - cohort_size
                additionalProperties: false
                properties:
                  question_id:
                    $ref: '#/components/schemas/PF_pf_feedback_v1/$defs/qid'
                  answers:
                    type: integer
                    minimum: 0
                  abandonment_after:
                    type: integer
                    minimum: 0
                  ambiguity_flags:
                    type: integer
                    minimum: 0
                  skip_rate:
                    type: number
                    minimum: 0
                    maximum: 1
                  cohort_size:
                    type: integer
                    minimum: 5
          description: B7 to WP2
        metadata:
          type: object
          additionalProperties: true
        recipient:
          type: string
          enum:
          - WP2
          - WP3
          - WP8
      title: pf.feedback.v1 payload - WP4 aggregated feedback to WP2/WP3/WP8 (B5-B7)
      description: Aggregated feedback. Per-cell thresholds reduce disclosure risk but do not establish anonymity.
      $defs:
        rmid:
          type: string
          pattern: ^pf:wp3:node:[a-z0-9-]{1,64}$
        ruleid:
          type: string
          pattern: ^pf:wp8:rule:[a-z0-9-]{1,64}$
        qid:
          type: string
          pattern: ^pf:wp4:question:[a-z0-9-]{1,64}$
      allOf:
      - if:
          properties:
            recipient:
              const: WP3
        then:
          required:
          - roadmap
          not:
            anyOf:
            - required:
              - rules
            - required:
              - questionnaire
      - if:
          properties:
            recipient:
              const: WP8
        then:
          required:
          - rules
          not:
            anyOf:
            - required:
              - roadmap
            - required:
              - questionnaire
      - if:
          properties:
            recipient:
              const: WP2
        then:
          required:
          - questionnaire
          not:
            anyOf:
            - required:
              - roadmap
            - required:
              - rules
    SnapshotEnvelope:
      title: SnapshotEnvelope
      description: 'The single delivery format for every cross-WP artefact (protocol §3): {contract, manifest, payload}.'
      type: object
      required:
      - contract
      - manifest
      - payload
      additionalProperties: false
      properties:
        contract:
          type: string
          enum:
          - pf.taxonomy.v1
          - pf.questionnaire.v1
          - pf.roadmap.v1
          - pf.rulebundle.v1
          - pf.feedback.v1
        manifest:
          $ref: '#/components/schemas/SnapshotEnvelope/$defs/manifest'
        payload:
          type: object
      allOf:
      - if:
          properties:
            contract:
              const: pf.taxonomy.v1
        then:
          properties:
            payload:
              $ref: '#/components/schemas/PF_pf_taxonomy_v1'
            manifest:
              properties:
                producer_wp:
                  const: WP2
      - if:
          properties:
            contract:
              const: pf.questionnaire.v1
        then:
          properties:
            payload:
              $ref: '#/components/schemas/PF_pf_questionnaire_v1'
            manifest:
              properties:
                producer_wp:
                  const: WP4
      - if:
          properties:
            contract:
              const: pf.roadmap.v1
        then:
          properties:
            payload:
              $ref: '#/components/schemas/PF_pf_roadmap_v1'
            manifest:
              properties:
                producer_wp:
                  const: WP3
      - if:
          properties:
            contract:
              const: pf.rulebundle.v1
        then:
          properties:
            payload:
              $ref: '#/components/schemas/PF_pf_rulebundle_v1'
            manifest:
              properties:
                producer_wp:
                  const: WP8
      - if:
          properties:
            contract:
              const: pf.feedback.v1
        then:
          properties:
            payload:
              $ref: '#/components/schemas/PF_pf_feedback_v1'
            manifest:
              properties:
                producer_wp:
                  const: WP4
      $defs:
        manifest:
          type: object
          required:
          - contract_version
          - snapshot_id
          - producer_wp
          - generated_at
          - generator
          - items_checksum
          - derived_from
          - dependencies
          additionalProperties: false
          properties:
            contract_version:
              type: string
              pattern: ^[0-9]+\.[0-9]+\.[0-9]+$
            snapshot_id:
              type: string
              format: uuid
            producer_wp:
              type: string
              enum:
              - WP2
              - WP3
              - WP4
              - WP8
            generated_at:
              type: string
              format: date-time
            generator:
              type: object
              required:
              - name
              - version
              properties:
                name:
                  type: string
                  minLength: 1
                version:
                  type: string
                  minLength: 1
                seed:
                  type:
                  - integer
                  - string
                  - 'null'
              additionalProperties: false
            supersedes:
              type:
              - string
              - 'null'
              format: uuid
            items_checksum:
              type: string
              pattern: ^sha256:[0-9a-f]{64}$
            dependencies:
              type: object
              propertyNames:
                enum:
                - pf.taxonomy.v1
                - pf.questionnaire.v1
                - pf.roadmap.v1
                - pf.rulebundle.v1
              additionalProperties:
                type: string
                format: uuid
            migration_notes:
              type: array
              items:
                type: object
                required:
                - from_version
                - to_version
                - change
                properties:
                  from_version:
                    type: string
                  to_version:
                    type: string
                  change:
                    type: string
                    minLength: 1
            derived_from:
              type: array
              minItems: 1
              description: The SCAILED deliverables/milestones this projection was extracted from (Part B objects,
                e.g. D2.1 stakeholder mapping, D3.1 landscape, MS3.1/D3.2 roadmap, T8.3.x outputs, D8.x).
              items:
                type: object
                required:
                - source
                - status
                properties:
                  source:
                    type: string
                    pattern: ^(D[0-9]+\.[0-9]+|WP[0-9]+/MS[0-9]+\.[0-9]+|T[0-9]+\.[0-9]+)
                    description: Part B object id. Milestones carry a WP qualifier (WP3/MS3.1) because Part B numbers
                      collide across work packages (WP1/MS3.1 is 'Project Completed', WP3/MS3.1 is 'Initial Strategic
                      Roadmap').
                  section:
                    type: string
                  status:
                    type: string
                    enum:
                    - approved
                    - draft
                    - forthcoming
                additionalProperties: false
    BoundaryImportRequest:
      type: object
      required:
      - snapshots
      additionalProperties: false
      properties:
        snapshots:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/SnapshotEnvelope'
          description: 'Complete runtime dependency closure in THIS batch: include taxonomy, roadmap, questionnaire(s)
            and rulebundle, plus every exact manifest.dependencies snapshot. Active snapshots are not merged into
            this batch. manifest.supersedes is historical lineage and does not require resubmitting its predecessor.'
      title: BoundaryImportRequest
    ActivationReport:
      type: object
      required:
      - accepted
      properties:
        accepted:
          type: boolean
        generation_id:
          type: string
          description: Identifier of the newly activated snapshot generation.
        snapshot_ids:
          type: object
          additionalProperties:
            type: string
          description: contract -> snapshot id now active.
        questionnaire_ids:
          type: object
          additionalProperties:
            type: string
          description: stakeholder type -> active questionnaire snapshot id.
        regulatory_status:
          type: string
          description: Status projected from the active rule bundle.
        warnings:
          type: array
          items:
            type: string
          description: Non-blocking findings (e.g. unverified compliance references, protocol §6).
      title: ActivationReport
      description: 400 + Validation error when any gate fails (all-or-nothing activation).
    LegacyWP2ImportRequest:
      type: object
      required:
      - version
      - stakeholder_types
      properties:
        version: &id001
          type: string
          minLength: 1
        stakeholder_types:
          type: array
          minItems: 1
          items:
            type: object
            required:
            - id
            - label
            - personas
            - user_journeys
            properties:
              id: *id001
              label: *id001
              personas: &id002
                type: array
                items:
                  type: string
              user_journeys: *id002
              capabilities: *id002
              pain_points: *id002
              feedback_categories: *id002
    LegacyWP3ImportRequest:
      type: object
      required:
      - version
      - nodes
      - edges
      properties:
        version: *id001
        nodes:
          type: array
          minItems: 1
          items:
            type: object
            required:
            - node_id
            - label
            - dimension
            - maturity_level
            - stakeholder_types
            properties:
              node_id: *id001
              label: *id001
              dimension: *id001
              maturity_level:
                type: integer
              stakeholder_types: *id002
              description:
                type: string
              prerequisites: *id002
              source_doc_ref:
                type: string
        edges:
          type: array
          items:
            type: object
            required:
            - edge_id
            - from_node_id
            - to_node_id
            properties:
              edge_id: *id001
              from_node_id: *id001
              to_node_id: *id001
              relation_type:
                type: string
              required:
                type: boolean
              source_doc_ref:
                type: string
    LegacyWP8ImportRequest:
      title: Pathfinder V1 Rule Bundle
      description: Schema for Pathfinder rule bundles consumed by RuleLoader. Defines deterministic condition DSL
        and action structure for WP8 compliance rules.
      type: object
      required:
      - version
      - rules
      - tests
      properties:
        version:
          type: string
          description: Semantic version of this rule bundle (e.g. 'gen-1000-rules-v1')
          pattern: ^[a-zA-Z0-9._-]+$
        rules:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/LegacyWP8ImportRequest/$defs/rule'
        tests:
          type: array
          minItems: 0
          items:
            $ref: '#/components/schemas/LegacyWP8ImportRequest/$defs/ruleTest'
      $defs:
        rule:
          type: object
          required:
          - rule_id
          - rule_type
          - priority
          - applies_to
          - condition
          - action
          - compliance_refs
          properties:
            rule_id:
              type: string
              description: Unique rule identifier within the bundle (e.g. 'WP8-RULE-0001')
              pattern: ^[A-Z0-9_-]+$
            rule_type:
              type: string
              enum:
              - eligibility
              - exclusion
              - preference
              - override
              description: eligibility = prerequisite check, exclusion = block path, preference = prioritised recommendation,
                override = force override other rules
            priority:
              type: integer
              description: Execution priority (higher = evaluated first; used for conflict resolution)
              minimum: 0
              maximum: 1000
            applies_to:
              type: array
              description: Stakeholder types this rule applies to. Use ['all'] for universal rules.
              items:
                type: string
              minItems: 1
            condition:
              $ref: '#/components/schemas/LegacyWP8ImportRequest/$defs/condition'
            action:
              $ref: '#/components/schemas/LegacyWP8ImportRequest/$defs/action'
            compliance_refs:
              type: array
              description: References to regulations (e.g. 'GDPR-Art.9', 'DGA-Art.7', 'EHDS-Art.33')
              items:
                type: string
              minItems: 1
            source_doc_ref:
              type: string
              description: Source document or spec section that defined this rule
              default: demo-data
            rule_version:
              type: string
              description: Version tag for this specific rule (may differ from bundle version)
              default: demo-rules-v1
            effective_from:
              type:
              - string
              - 'null'
              format: date
              description: Date from which this rule is effective (null = always)
              default: null
            effective_until:
              type:
              - string
              - 'null'
              format: date
              description: Date after which this rule expires (null = never)
              default: null
            parent_rule_id:
              type:
              - string
              - 'null'
              description: Parent rule ID for rule versioning/overrides
              default: null
        condition:
          description: 'Deterministic condition DSL. One of: compound (and/or/not), atomic (field+operator+value),
            or empty (always true).'
          oneOf:
          - $ref: '#/components/schemas/LegacyWP8ImportRequest/$defs/conditionCompoundAnd'
          - $ref: '#/components/schemas/LegacyWP8ImportRequest/$defs/conditionCompoundOr'
          - $ref: '#/components/schemas/LegacyWP8ImportRequest/$defs/conditionCompoundNot'
          - $ref: '#/components/schemas/LegacyWP8ImportRequest/$defs/conditionAtomic'
          - $ref: '#/components/schemas/LegacyWP8ImportRequest/$defs/conditionEmpty'
        conditionCompoundAnd:
          type: object
          required:
          - and
          properties:
            and:
              type: array
              description: ALL sub-conditions must evaluate to true
              items:
                $ref: '#/components/schemas/LegacyWP8ImportRequest/$defs/condition'
              minItems: 1
          additionalProperties: false
        conditionCompoundOr:
          type: object
          required:
          - or
          properties:
            or:
              type: array
              description: ANY sub-condition must evaluate to true
              items:
                $ref: '#/components/schemas/LegacyWP8ImportRequest/$defs/condition'
              minItems: 1
          additionalProperties: false
        conditionCompoundNot:
          type: object
          required:
          - not
          properties:
            not:
              description: Sub-condition that must evaluate to false
              $ref: '#/components/schemas/LegacyWP8ImportRequest/$defs/condition'
          additionalProperties: false
        conditionAtomic:
          type: object
          required:
          - field
          - operator
          description: Atomic field comparison. The 'value' field is required for all operators except 'exists'.
          properties:
            field:
              type: string
              description: Field path in StakeholderState to evaluate
              pattern: ^(answers\.|maturity\.)?[a-zA-Z_][a-zA-Z0-9_.]*$
              examples:
              - answers.governance_maturity
              - maturity.governance
              - stakeholder_type
              - capabilities
              - missing_capabilities
              - regulatory_flags
              - target_scenario
            operator:
              type: string
              enum:
              - eq
              - ne
              - gt
              - gte
              - lt
              - lte
              - in
              - not_in
              - contains
              - exists
              description: Comparison operator. 'contains' checks membership in a list field. 'exists' checks non-null/non-empty.
            value:
              description: 'Expected value. Type depends on the operator: scalar for eq/ne/gt/gte/lt/lte, array
                for in/not_in/contains, ignored for exists.'
          additionalProperties: false
        conditionEmpty:
          type: object
          description: Empty condition = always true (matches all states)
          maxProperties: 0
        action:
          type: object
          required:
          - title
          - text
          properties:
            title:
              type: string
              description: Short human-readable action title
            text:
              type: string
              description: Detailed action description displayed to the user
            node_id:
              type:
              - string
              - 'null'
              description: Suggested roadmap node to route to when this rule triggers (null = no reroute)
            warning:
              type:
              - string
              - 'null'
              description: Warning message appended to the path result (null = no warning)
            block:
              type: boolean
              description: If true, this rule BLOCKS the current path (produces a blocker in PathResult)
              default: false
          additionalProperties: false
        ruleTest:
          type: object
          required:
          - name
          - state
          - expected_rule_ids
          properties:
            name:
              type: string
              description: Human-readable test case name
            state:
              $ref: '#/components/schemas/LegacyWP8ImportRequest/$defs/testState'
            expected_rule_ids:
              type: array
              description: Rule IDs that should trigger for this state (sorted alphabetically for comparison)
              items:
                type: string
        testState:
          type: object
          required:
          - stakeholder_type
          - target_scenario
          - answers
          properties:
            stakeholder_type:
              type: string
            target_scenario:
              type: string
            answers:
              type: object
              description: Questionnaire answers including maturity scores, capabilities, missing_capabilities,
                regulatory_flags
              additionalProperties: true
  securitySchemes:
    BearerAuth:
      type: http
      description: Use PATHFINDER_DEMO_TOKEN for invited /v1 business operations, or PATHFINDER_ADMIN_TOKEN for
        all operations. Boundary imports and every /admin operation require the admin token.
      scheme: bearer
servers:
- url: /
  description: Current API origin (hosted documentation)
- url: http://localhost:8000
  description: local development (docker compose up)
tags:
- name: Boundary contracts
  description: WP2/WP3/WP4/WP8 snapshot import and activation (the frozen interface).
- name: Questionnaires
  description: WP4 questionnaire definitions served from the active snapshot generation.
- name: Assessments
  description: Stakeholder assessment session lifecycle and deterministic results.
- name: Roadmap
  description: WP3 roadmap graph, projected from the active pf.roadmap.v1 snapshot.
- name: Admin (legacy demo)
  description: Single-file per-WP imports and rule reload for the in-memory mode.
- name: Health
  description: Liveness and readiness.
