# ═══════════════════════════════════════════════════════════════════════
# SCAILED WP4 Pathfinder System — Docker Compose
# 议会决议 (2026-05-13, 九龙全票): 多容器，单机部署，No K8s
# 审计修订 (2026-05-14, 六席复审): PostgreSQL独立volume, AGE图引擎
# ═══════════════════════════════════════════════════════════════════════
#
# 容器拓扑:
#   traefik (反向代理/TLS) ──→ frontend (nginx + React SPA)
#                           ──→ backend  (FastAPI, 可水平扩展)
#   backend ──→ postgres (PG16 + Apache AGE)
#           ──→ redis   (可选缓存)
#
# 部署: docker compose up -d
# 扩容: docker compose up -d --scale backend=3

networks:
# 前端网络: traefik ↔ nginx (仅代理流量)
# 后端网络: traefik ↔ backend ↔ postgres ↔ redis (业务+数据流量隔离)
  frontend:
    driver: bridge
  backend:
    driver: bridge

# ─── Volumes ──────────────────────────────────────────────────────────
volumes:
  pgdata:
    name: scailed_pgdata
  redis_data:
    name: scailed_redis_data

# ─── Services ─────────────────────────────────────────────────────────
services:

  # ┌──────────────────────────────────────────────────────────────────┐
  # │ Traefik — 反向代理 / TLS终结 / 速率限制                           │
  # │ 端口: 80 (HTTP) / 443 (HTTPS, 生产环境)                           │
  # └──────────────────────────────────────────────────────────────────┘
  traefik:
    image: traefik:v3.7
    container_name: scailed-traefik
    restart: unless-stopped
    command:
      - "--log.level=DEBUG"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
    ports:
      - "${TRAEFIK_HTTP_PORT:-80}:80"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - frontend
      - backend
    labels: {}

  # ┌──────────────────────────────────────────────────────────────────┐
  # │ Frontend — Nginx 提供 React SPA 静态文件                         │
  # │ 暴露路径: /                                                       │
  # │ API 代理: /api/* → backend (避免 CORS)                            │
  # └──────────────────────────────────────────────────────────────────┘
  frontend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
    image: scailed/frontend:latest
    container_name: scailed-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - frontend
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=PathPrefix(`/`)"
      - "traefik.http.routers.frontend.entrypoints=web"
      - "traefik.http.services.frontend.loadbalancer.server.port=80"

  # ┌──────────────────────────────────────────────────────────────────┐
  # │ Backend — FastAPI 3.12 业务层 (无状态，可水平扩展)                  │
  # │ 端口: 8000 (内部)                                                 │
  # └──────────────────────────────────────────────────────────────────┘
  backend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.backend
    image: scailed/backend:latest
    container_name: scailed-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - backend
      - frontend   # 需要 frontend 网络以接收 traefik 路由
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api.rule=PathPrefix(`/api`) || PathPrefix(`/v1`) || Path(`/health`)"
      - "traefik.http.routers.api.entrypoints=web"
      - "traefik.http.services.api.loadbalancer.server.port=8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-pathfinder}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-pathfinder}
      - REDIS_URL=redis://redis:6379/0
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - SECRET_KEY=${SECRET_KEY:-dev-secret-change-in-production}
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - WP3_API_URL=${WP3_API_URL:-}
      - WP8_API_URL=${WP8_API_URL:-}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    # 无状态: 不挂载任何 volume
    # 扩容: docker compose up -d --scale backend=3

  # ┌──────────────────────────────────────────────────────────────────┐
  # │ PostgreSQL — 有状态数据库 (独立容器 + named volume)                 │
  # │ 端口: 5432 (内部, 仅 backend 网络可访问)                           │
  # │ 扩展: Apache AGE 图引擎 (Cypher/FTS inside SQL)                    │
  # └──────────────────────────────────────────────────────────────────┘
  postgres:
    build:
      context: .
      dockerfile: Dockerfile.postgres
    image: scailed/postgres:latest
    container_name: scailed-postgres
    restart: unless-stopped
    networks:
      - backend      # 仅后端网络 — 不暴露到 frontend 或公网
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pathfinder}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-pathfinder}
    volumes:
      - pgdata:/var/lib/postgresql/data                  # 持久化数据
      - ./pg-init/:/docker-entrypoint-initdb.d/:ro       # AGE 安装 + Schema 初始化
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pathfinder} -d ${POSTGRES_DB:-pathfinder}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    command: >
      postgres
      -c shared_preload_libraries='age'
      -c max_connections=100
      -c shared_buffers=256MB
      -c effective_cache_size=768MB
      -c maintenance_work_mem=64MB

  # ┌──────────────────────────────────────────────────────────────────┐
  # │ Redis — 可选缓存层 (session 缓存 / 规则热加载锁)                    │
  # │ 端口: 6379 (内部)                                                 │
  # └──────────────────────────────────────────────────────────────────┘
  redis:
    image: redis:7-alpine
    container_name: scailed-redis
    restart: unless-stopped
    networks:
      - backend
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    # 生产环境添加: command: redis-server --requirepass ${REDIS_PASSWORD}
