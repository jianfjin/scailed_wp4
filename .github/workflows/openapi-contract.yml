name: openapi-contract

# Guards docs/18_pathfinder_openapi.{json,yaml} against drift from the
# FastAPI code. Regenerate locally with:  python3 scripts/build_openapi.py

on:
  push:
    paths:
      - "pathfinder/api/**"
      - "contracts/**"
      - "pathfinder/core/rules/schema.json"
      - "scripts/build_openapi.py"
      - "scripts/build_swagger_ui.py"
      - "docs/18_pathfinder_openapi.*"
      - "docs/18_pathfinder_swagger.html"
      - "tests/test_openapi_contract.py"
      - "tests/test_api_contract_behavior.py"
      - ".github/workflows/openapi-contract.yml"
  pull_request:
  workflow_dispatch:

jobs:
  contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          pip install -r requirements.txt
          pip install openapi-spec-validator pyyaml
      - name: Committed spec matches code (drift gate)
        run: python3 scripts/build_openapi.py --check
      - name: Spec is valid OpenAPI 3.1
        run: python3 -m openapi_spec_validator docs/18_pathfinder_openapi.json
      - name: Contract tests
        env:
          ENVIRONMENT: development
          PATHFINDER_DEMO_TOKEN: demo-token
          PATHFINDER_ADMIN_TOKEN: admin-token
          BOUNDARY_STORAGE: memory
        run: python3 -m pytest tests/test_openapi_contract.py tests/test_api_contract_behavior.py -v
